<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="banner">
        <h1>Aula CSS</h1>
        <p>Introdução a estilização de paginas</p>
    </div>
    <h2>Seletores</h2>
    <p>este e um paragrafo normal.</p>
    <p class="destaque">Este e um paragrafo com classe destaque.</p>
    <p id="especial">Este e um paragrafo com id especial</p>

    <h2>Imagem</h2>
    <img src="https://picsum.photos/600/300">

    <h2>Tabela</h2>
    <table>  <!--Inicializa a tabela-->
        <tr> <!-- Cada tr faz uma linha-->
            <th>Elemento</th>    <!--CAbeçalho da coluna-->
            <th>Função</th>
        </tr>
        <tr>
            <td>&lt;p&gt;</td>   <!--Linha normal-->
        </tr>
        <tr>
            <td>&lt;a&gt;</td>
            <td>LInk</td>
        </tr>
    </table>
    <h2>Botão com efeito</h2>
    <button class="botao">Clique aqui</button>
</body>
</html>
